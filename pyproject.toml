[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-prior-residual-repro"
version = "0.7.0"
description = "Code and analysis pipeline for prior-residual BMS-reported EV SoC"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7,<4"]
analysis = ["pyarrow>=14,<25", "matplotlib>=3.7,<4"]
train = ["torch>=2.4,<3", "pyarrow>=14,<25"]
all = ["torch>=2.4,<3", "pyarrow>=14,<25", "matplotlib>=3.7,<4"]

[project.scripts]
soc-repro = "soc_repro.cli:main"
soc-repro-report = "soc_repro.report:main"
soc-repro-inventory = "soc_repro.experiments:main"

[tool.setuptools.packages.find]
include = ["soc_repro*"]
